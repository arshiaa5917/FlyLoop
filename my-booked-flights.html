<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders – FlyLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/flights.css" />

  <!-- Orders UI polish + desktop layout override (no empty right side) -->
  <style>
    /* Without this, flights.css may reserve space for sidebar even when you want a centered page */
    .content { max-width: 1050px; margin: 0 auto; padding: 28px 20px 50px; }
    .orders-card { padding: 16px; }
    .orders-list { display:flex; flex-direction:column; gap:12px; }

    .section-title{
      font-size: 18px;
      font-weight: 750;
      letter-spacing: .2px;
      margin: 34px 0 14px;
      opacity: .92;
    }

    .order-row{
      border: 1px solid rgba(148,163,184,.25);
      border-radius: 18px;
      padding: 14px;
      background: rgba(2,6,23,.30);
      box-shadow: 0 14px 30px rgba(0,0,0,.35);
    }

    .order-grid{
      display:grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .order-route{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      font-weight: 850;
      letter-spacing:.2px;
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.28);
      background: rgba(255,255,255,.03);
      font-size: 12px;
      font-weight: 700;
      opacity:.92;
    }

    .order-meta{
      margin-top: 8px;
      display:flex;
      flex-direction:column;
      gap: 4px;
      opacity: .88;
      font-size: 13px;
      line-height: 1.25rem;
    }

    .order-times{
      display:flex;
      flex-direction:column;
      gap: 8px;
      padding-top: 2px;
      opacity:.92;
    }
    .time-line{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight: 750;
      letter-spacing:.2px;
    }
    .time-line small{ font-weight:600; opacity:.75; }

    .order-right{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap: 10px;
      min-width: 160px;
    }

    .price-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.25);
      background: rgba(255,255,255,.03);
      font-weight: 850;
      letter-spacing:.2px;
      white-space: nowrap;
    }

    .row-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }

    .order-row.is-canceled{
      opacity: .72;
      filter: saturate(.85);
    }

    @media (max-width: 860px){
      .order-grid{ grid-template-columns: 1fr; }
      .order-right{ align-items:flex-start; min-width: 0; }
      .row-actions{ justify-content:flex-start; }
    }
  </style>
</head>

<body>
  <!-- Mobile top bar (same as flights page) -->
  <header class="mobile-topbar" aria-label="Mobile header">
    <div class="mobile-topbar-inner">
      <button class="hamburger" id="openNavBtn" type="button"
              aria-label="Open menu" aria-controls="sidebarNav" aria-expanded="false">
        <span class="hamburger-icon" aria-hidden="true"><span></span></span>
        Menu
      </button>

      <a href="index.html" class="sidebar-logo" style="margin:0;" aria-label="FlyLoop home"><img src="logo.png?v=2" alt="FlyLoop logo" /><span>FLYLOOP</span></a>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <div class="layout">
    <!-- Sidebar (added to Orders page) -->
    <aside class="sidebar" id="sidebarNav" aria-label="Dashboard navigation">
      <button class="sidebar-close" id="closeNavBtn" type="button" aria-label="Close menu">
        Close ✕
      </button>

      <a href="index.html" class="sidebar-logo" aria-label="FlyLoop home"><img src="logo.png?v=2" alt="FlyLoop logo" /><span>FLYLOOP</span></a>

      <div class="sidebar-title">Dashboard</div>

      <nav class="sidebar-nav" aria-label="Dashboard pages">
        <a class="sidebar-link" href="dashboard.html#overview">
          <span class="label">Overview</span>
          <small>Trips &amp; plan</small>
        </a>

        <a class="sidebar-link" href="dashboard.html#account">
          <span class="label">Account</span>
          <small>Profile &amp; billing</small>
        </a>

        <a class="sidebar-link" href="flights.html">
          <span class="label">Flights</span>
          <small>Live search</small>
        </a>

        <a class="sidebar-link active" href="my-orders.html" aria-current="page">
          <span class="label">My Orders</span>
          <small>Bookings</small>
        </a>

        <a class="sidebar-link" href="dashboard.html#settings">
          <span class="label">Settings</span>
          <small>Preferences</small>
        </a>
      </nav>

      <div class="sidebar-footer">
        Logged in as <strong>demo@flyloop.com</strong><br />
        <a href="login.html" class="logout-link">Log out</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="content">
      <div class="eyebrow">Dashboard</div>
      <h1 style="margin:6px 0 0;">My Orders</h1>

      <!-- Active -->
      <section class="card orders-card" aria-label="Active flights" style="margin-top:16px;">
        <div class="section-title" style="margin:0 0 14px;">Active flights</div>
        <div class="orders-list" id="orders-active">
          <div class="pill">Loading…</div>
        </div>
      </section>

      <!-- Title OUTSIDE box (your requirement) -->
      <div class="section-title">Canceled flights</div>

      <!-- Canceled -->
      <section class="card orders-card" aria-label="Canceled flights">
        <div class="orders-list" id="orders-canceled">
          <div class="pill">No canceled flights.</div>
        </div>
      </section>

      <div class="actions" style="margin-top:22px;">
        <a class="btn-outline" href="dashboard.html#overview">Back to Dashboard</a>
        <a class="btn-primary" href="flights.html">Book another flight</a>
      </div>
    </main>
  </div>

  <script>
    /* --------------------------
       Sidebar open/close (shared)
       -------------------------- */
    (function initSidebar() {
      const openBtn = document.getElementById("openNavBtn");
      const closeBtn = document.getElementById("closeNavBtn");
      const overlay = document.getElementById("sidebarOverlay");
      const sidebar = document.getElementById("sidebarNav");

      function openNav() {
        document.body.classList.add("nav-open");
        if (openBtn) openBtn.setAttribute("aria-expanded", "true");
        if (overlay) overlay.setAttribute("aria-hidden", "false");
      }

      function closeNav() {
        document.body.classList.remove("nav-open");
        if (openBtn) openBtn.setAttribute("aria-expanded", "false");
        if (overlay) overlay.setAttribute("aria-hidden", "true");
      }

      if (openBtn) openBtn.addEventListener("click", openNav);
      if (closeBtn) closeBtn.addEventListener("click", closeNav);
      if (overlay) overlay.addEventListener("click", closeNav);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeNav();
      });

      // Prevent clicks inside sidebar from closing
      if (sidebar) {
        sidebar.addEventListener("click", (e) => e.stopPropagation());
      }
    })();

    /* --------------------------
       Orders (Active + Canceled)
       -------------------------- */
    const ORDERS_KEY = "flyloop_orders";
    const activeEl = document.getElementById("orders-active");
    const canceledEl = document.getElementById("orders-canceled");

    let orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");

    function saveOrders() {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function priceText(o){
      if (o.priceText) return o.priceText;
      if (typeof o.price === "number") return `CAD ${o.price.toFixed(2)}`;
      return "CAD —";
    }

    function renderOrderRow(o, canCancel){
      const route = `${o.origin || "—"} → ${o.destination || "—"}`;
      const status = o.status || "Booked";
      const date = o.departDate || "—";
      const departTime = o.departTime || "—";
      const arriveTime = o.arriveTime || "—";
      const cabin = o.cabin || "ECONOMY";
      const pax = o.adults || 1;
      const id = o.id || "—";
      const canceledClass = (status === "Canceled") ? "is-canceled" : "";

      return `
        <div class="order-row ${canceledClass}" data-order-id="${escapeHtml(id)}">
          <div class="order-grid">
            <div>
              <div class="order-route">
                <span>${escapeHtml(route)}</span>
                <span class="status-pill">${escapeHtml(status)}</span>
              </div>

              <div class="order-meta">
                <div>${escapeHtml(date)}</div>
                <div>Cabin: <strong>${escapeHtml(cabin)}</strong> • Pax: <strong>${escapeHtml(pax)}</strong></div>
                <div>Order: <strong>${escapeHtml(id)}</strong></div>
              </div>
            </div>

            <div class="order-times">
              <div class="time-line">
                <span>${escapeHtml(departTime)}</span>
                <small>depart</small>
              </div>
              <div class="time-line">
                <span>${escapeHtml(arriveTime)}</span>
                <small>arrive</small>
              </div>
            </div>

            <div class="order-right">
              <div class="price-pill">${escapeHtml(priceText(o))}</div>

              ${canCancel ? `
                <div class="row-actions">
                  <button class="btn-outline" type="button" data-action="cancel" data-id="${escapeHtml(id)}">
                    Cancel
                  </button>
                </div>
              ` : ""}
            </div>
          </div>
        </div>
      `;
    }

    function render(){
      const flightOrders = orders.filter(o => (o.orderType || "flight") === "flight");
      const active = flightOrders.filter(o => (o.status || "Booked") !== "Canceled");
      const canceled = flightOrders.filter(o => (o.status || "") === "Canceled");

      activeEl.innerHTML = active.length
        ? active.map(o => renderOrderRow(o, true)).join("")
        : `<div class="pill">No active bookings.</div>`;

      canceledEl.innerHTML = canceled.length
        ? canceled.map(o => renderOrderRow(o, false)).join("")
        : `<div class="pill">No canceled flights.</div>`;
    }

    // Cancel handler (confirm + move to canceled + scroll)
    document.addEventListener("click", (e) => {
      const btn = e.target.closest('button[data-action="cancel"]');
      if (!btn) return;

      const id = btn.getAttribute("data-id");
      if (!id) return;

      const ok = confirm("Are you sure you want to cancel?");
      if (!ok) return;

      orders = orders.map(o =>
        o.id === id ? { ...o, status: "Canceled", canceledAt: new Date().toISOString() } : o
      );

      saveOrders();
      render();

      canceledEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    render();
  </script>
</body>
</html>
