<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders – FlyLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/flights.css" />
</head>
<body>
  <div class="layout">
    <main class="content" style="padding-top:30px;">
      <div class="eyebrow">Dashboard</div>
      <h1>My Orders</h1>

      <section class="card" aria-label="Orders">
        <div class="results" id="orders">
          <div class="pill">Loading…</div>
        </div>
      </section>

      <div class="actions" style="margin-top:16px;">
        <a class="btn-outline" href="dashboard.html#overview">Back to Dashboard</a>
        <a class="btn-primary" href="flights.html">Book another flight</a>
      </div>
    </main>
  </div>

  <script>
    const ORDERS_KEY = "flyloop_orders";
    const ordersEl = document.getElementById("orders");

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function loadOrders() {
      return JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function render() {
      const orders = loadOrders();

      // show only flights (safe for future hotels/packages)
      const flightOrders = orders.filter(o => (o.orderType || "flight") === "flight");

      if (!flightOrders.length) {
        ordersEl.innerHTML = `<div class="pill">No orders yet.</div>`;
        return;
      }

      ordersEl.innerHTML = flightOrders.map(o => {
        const route = `${o.origin || "—"} → ${o.destination || "—"}`;
        const date = o.departDate || "—";
        const departTime = o.departTime || "—";
        const arriveTime = o.arriveTime || "—";
        const price = o.priceText || (typeof o.price === "number" ? `CAD ${o.price.toFixed(2)}` : "CAD —");
        const id = o.id || "";
        const status = o.status || "Booked";
        const isCanceled = String(status).toLowerCase() === "canceled";

        return `
          <div class="hotel-item">
            <div class="hotel-top">
              <div>
                <div class="hotel-name">
                  ${escapeHtml(route)}
                  <span class="pill" style="margin-left:8px;">${escapeHtml(status)}</span>
                </div>

                <div class="hotel-sub">
                  ${escapeHtml(date)} • ${escapeHtml(departTime)} → ${escapeHtml(arriveTime)}
                </div>

                <div class="hotel-sub">
                  Cabin: ${escapeHtml(o.cabin || "ECONOMY")} • Pax: ${escapeHtml(o.adults || 1)}
                </div>

                <div class="hotel-sub">
                  Order: ${escapeHtml(id || "—")}
                </div>

                <div class="hotel-actions" style="margin-top:12px;">
                  <button
                    class="btn-outline"
                    type="button"
                    data-action="cancel"
                    data-id="${escapeHtml(id)}"
                    ${(!id || isCanceled) ? "disabled" : ""}>
                    ${isCanceled ? "Canceled" : "Cancel"}
                  </button>
                </div>
              </div>

              <div class="pill">${escapeHtml(price)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // ✅ cancel click handler (works for all cards)
    ordersEl.addEventListener("click", (e) => {
      const btn = e.target.closest('button[data-action="cancel"]');
      if (!btn) return;

      const id = btn.getAttribute("data-id");
      if (!id) return;

      const ok = window.confirm("Are u sure u wanna cancel?");
      if (!ok) return;

      const orders = loadOrders();
      const idx = orders.findIndex(o => String(o.id || "") === String(id));
      if (idx === -1) return;

      orders[idx].status = "Canceled";
      orders[idx].canceledAt = new Date().toISOString();

      saveOrders(orders);
      render();
    });

    // initial render
    render();
  </script>
</body>
</html>
