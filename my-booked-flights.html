<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders – FlyLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/flights.css" />
</head>
<body>
  <div class="layout">
    <main class="content" style="padding-top:30px;">
      <div class="eyebrow">Dashboard</div>
      <h1>My Orders</h1>

      <!-- ✅ ACTIVE FLIGHTS -->
      <section class="card" aria-label="Active flights">
        <h3 style="margin-bottom:12px;">Active flights</h3>
        <div class="results" id="orders-active">
          <div class="pill">Loading…</div>
        </div>
      </section>

      <!-- ✅ CANCELED FLIGHTS (BOTTOM) -->
      <section class="card" aria-label="Canceled flights" style="margin-top:24px;">
        <h3 style="margin-bottom:12px;">Canceled flights</h3>
        <div class="results" id="orders-canceled">
          <div class="pill">No canceled flights.</div>
        </div>
      </section>

      <div class="actions" style="margin-top:16px;">
        <a class="btn-outline" href="dashboard.html#overview">Back to Dashboard</a>
        <a class="btn-primary" href="flights.html">Book another flight</a>
      </div>
    </main>
  </div>

  <script>
    const ORDERS_KEY = "flyloop_orders";
    const activeEl = document.getElementById("orders-active");
    const canceledEl = document.getElementById("orders-canceled");

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function loadOrders() {
      return JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function renderSection(list, targetEl, isCanceledSection) {
      if (!targetEl) return;

      if (!list.length) {
        targetEl.innerHTML = `<div class="pill">${
          isCanceledSection ? "No canceled flights." : "No active flights."
        }</div>`;
        return;
      }

      targetEl.innerHTML = list.map(o => {
        const route = `${o.origin || "—"} → ${o.destination || "—"}`;
        const date = o.departDate || "—";
        const departTime = o.departTime || "—";
        const arriveTime = o.arriveTime || "—";
        const price = o.priceText || (typeof o.price === "number" ? `CAD ${o.price.toFixed(2)}` : "CAD —");
        const id = o.id || "—";
        const status = o.status || "Booked";

        return `
          <div class="hotel-item" style="${isCanceledSection ? "opacity:.65;" : ""}">
            <div class="hotel-top">
              <div>
                <div class="hotel-name">
                  ${escapeHtml(route)}
                  <span class="pill" style="margin-left:8px;">${escapeHtml(status)}</span>
                </div>

                <div class="hotel-sub">
                  ${escapeHtml(date)} • ${escapeHtml(departTime)} → ${escapeHtml(arriveTime)}
                </div>

                <div class="hotel-sub">
                  Cabin: ${escapeHtml(o.cabin || "ECONOMY")} • Pax: ${escapeHtml(o.adults || 1)}
                </div>

                <div class="hotel-sub">
                  Order: ${escapeHtml(id)}
                </div>

                ${
                  !isCanceledSection ? `
                  <div class="hotel-actions" style="margin-top:12px;">
                    <button
                      class="btn-outline"
                      type="button"
                      data-action="cancel"
                      data-id="${escapeHtml(id)}">
                      Cancel
                    </button>
                  </div>
                  ` : ""
                }
              </div>

              <div class="pill">${escapeHtml(price)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function render() {
      const orders = loadOrders().filter(o => (o.orderType || "flight") === "flight");

      const active = orders.filter(o => String(o.status || "Booked") !== "Canceled");
      const canceled = orders.filter(o => String(o.status || "") === "Canceled");

      renderSection(active, activeEl, false);
      renderSection(canceled, canceledEl, true);
    }

    // ✅ Cancel handler only on ACTIVE section
    activeEl.addEventListener("click", (e) => {
      const btn = e.target.closest('button[data-action="cancel"]');
      if (!btn) return;

      const id = btn.getAttribute("data-id");
      if (!id) return;

      const ok = window.confirm("Are u sure u wanna cancel?");
      if (!ok) return;

      const orders = loadOrders();
      const idx = orders.findIndex(o => String(o.id || "") === String(id));
      if (idx === -1) return;

      orders[idx].status = "Canceled";
      orders[idx].canceledAt = new Date().toISOString();

      saveOrders(orders);
      render();

      // ✅ scroll to canceled section after cancel
      canceledEl.scrollIntoView({ behavior: "smooth" });
    });

    // Initial render
    render();
  </script>
</body>
</html>
