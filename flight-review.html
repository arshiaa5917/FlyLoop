<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Review Flight – FlyLoop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/flights.css" />
  <link rel="stylesheet" href="assets/review.css" />
</head>
<body>
  <main class="review-wrap">
    <div class="eyebrow">CHECKOUT</div>
    <h1>Review<br/>your flight</h1>

    <div class="review-grid">
      <section class="card">
        <h3 style="margin-top:0;">Trip details</h3>

        <div class="pill" id="route">—</div>
        <div class="pill" id="meta" style="margin-top:10px;">—</div>

        <div style="margin-top:16px;">
          <div class="review-row">
            <div class="review-k">Departure time</div>
            <div class="review-v" id="departTime">—</div>
          </div>
          <div class="review-row">
            <div class="review-k">Arrival time</div>
            <div class="review-v" id="arriveTime">—</div>
          </div>
          <div class="review-row">
            <div class="review-k">Total</div>
            <div class="review-v review-total" id="price">—</div>
          </div>
        </div>

        <div class="actions" style="margin-top:16px;">
          <a class="btn-outline" href="flights.html">Back</a>
          <button class="btn-primary" id="toCheckoutBtn" type="button">Continue to checkout</button>
        </div>
      </section>

      <section class="card">
        <h3 style="margin-top:0;">What happens next?</h3>
        <div class="pill">This is a demo checkout using FlyLoop credits.</div>
        <div class="pill" style="margin-top:10px;">After booking, it will appear in <strong>My Orders</strong>.</div>
      </section>
    </div>
  </main>

  <script src="assets/review.js"></script>
</body>
</html>
